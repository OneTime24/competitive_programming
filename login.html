<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page:</title>

    <style>

     body {
    background-color: bisque;
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 10px;
}

    .log{
        background: white;
        padding: 100px;
        border-radius: 20px;
        border: 10px;
        box-shadow: 0px 8px 20px;
        width: 300px;
        text-align: center;
        line-height: 40px;
    }
    .log h2{
    margin-bottom: 30px;
    color:darkgoldenrod;
    text-decoration-line:underline;
    }
    
    .log h2:hover{
        color:burlywood


    }
    #btn{
        background-color: bisque;
        border-radius: 7px;
        font-size: 18px;
        margin: auto;
        padding: 2.5px;
    }
    </style>
</head>
<body>
    
    <div class="log">
    <h2>Login</h2>
        <form action="">
    <label for="">Enter Username:</label>
    <input type="text" placeholder="Username" required>
   <br>
    <label for="">Enter Password: </label>
    <input type="password" placeholder="Password" required>
    <br>
    <button type="submit" id="btn" style="margin-top: 20px; width: 80px;">Login
</form>
    </div>
</body>
</html>
